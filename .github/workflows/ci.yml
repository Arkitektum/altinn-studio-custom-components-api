name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            # Completely remove Yarn 1 so Corepack takes over
            - name: Remove preinstalled Yarn 1
              run: sudo rm -f /usr/local/bin/yarn /usr/local/bin/yarnpkg || true

            - name: Enable Corepack
              run: corepack enable

            - name: Verify Yarn version
              run: yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Run tests
              run: yarn test
