approvedGitRepositories:
    - "**"

enableScripts: true

nodeLinker: node-modules

# A version has to be a day old before Yarn will install it, so a hijacked release can be caught and pulled before it
# reaches us. Our own packages are let through at once, so a fresh release can be picked up straight away.
npmMinimalAgeGate: 1d

npmPreapprovedPackages:
    - "@arkitektum/*"
